[build-system]
requires = ["setuptools==75.8.0"]

[project]
name = "pricing-advertising"
version = "0.0.9"
authors = [{ name = "Giulia Forasassi-ML3" }]
description = "Pricing-Advertising"
readme = "README.md"
requires-python = ">=3.12"
# list of project dependencies
dependencies = [
    "gymnasium>=1.0.0",
    "matplotlib>=3.10.0",
    "scipy>=1.15.2",
    "torch>=2.6.0",
    "pydantic>=2.0.0",
]

# dependencies needed to lint and run tests
[dependency-groups]
dev = [
    "ruff>=0.7.3",
    "mypy>=1.15.0",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.25.3",
    "pytest-xdist[psutil]",
]

