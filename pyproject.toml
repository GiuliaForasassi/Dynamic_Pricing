[build-system]
requires = ["setuptools==75.8.0"]

[project]
name = "pricing-advertising"
version = "0.0.9"
authors = [ {name="Giulia Forasassi-ML3"}]
description = "Pricing-Advertising"
readme = "README.md"
requires-python = ">=3.12"
# list of project dependencies
dependencies = [
    "gymnasium>=1.0.0",
    "matplotlib>=3.10.0",
    "scipy>=1.15.1",
    "torch>=2.5.1",
]

# dependencies needed to lint and run tests
[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-xdist[psutil]",
    "ruff>=0.7.3",
]

[[tool.uv.index]]
name = "internal-repo"
url = "https://mlcube-883313729965.d.codeartifact.eu-west-3.amazonaws.com/pypi/ml3-platform/simple/"
