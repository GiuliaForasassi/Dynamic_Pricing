[build-system]
requires = ["setuptools==75.8.0"]

[project]
name = "pricing-advertising"
version = "0.0.9"
authors = [{ name = "Giulia Forasassi-ML3" }]
description = "Pricing-Advertising"
readme = "README.md"
requires-python = ">=3.12"
# list of project dependencies
 dependencies = [
    "gymnasium>=1.0.0",
    "scipy>=1.15.2",
    "torch>=2.6.0",
    "pydantic>=2.0.0",
    "tqdm>=4.67.1",
    "loguru>=0.7.3",
    "stable-baselines3>=2.6.0",
    "pygame>=2.6.1",
    "rich>=13.9.4",
    "mlflow>=2.21.2",
    "optuna>=4.2.1",
    "snakeviz>=2.2.2",
]

# dependencies needed to lint and run tests
[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "jupyter>=1.1.1",
    "ipykernel>=6.29.5",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.9.6",
]

[tool.setuptools]
py-modules = [
    "pricing_advertising"
]

