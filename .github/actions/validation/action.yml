# GitHub actions is one of the possibile CI/CD solutions
#they are procedures that are executed by Github and are used to build docker images.

name: Code validation
description: validate code by running linters and tests
runs:
  using: "composite"
  steps:
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version-file: "pyproject.toml"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ env.AWS_REGION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.5.1"

    - name: Install the project
      run: make dev-sync
      shell: bash

    - name: code validation
      run: make all-validation
      shell: bash
