name: on-tag docker push
#  the action is triggered when a tag is pushed, it creates the docker file and pushes it to the registry

# The action is triggered only if the tag has the version structure like:
# v1.23.34
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# The job or workflow run requires a permissions setting with id-token: write.
# You won't be able to request the OIDC JWT ID token if the permissions setting
# for id-token is set to read or none. The aws-actions/configure-aws-credentials
# action receives a JWT from the GitHub OIDC provider, and then requests an access token from AWS.
permissions:
  id-token: write
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3
      - name: validate code
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PWD: ${{ secrets.NEXUS_PWD }}
        uses: ./.github/actions/validation
  docker-push:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: Extract deploy environment name
        shell: bash
        run: echo "##[set-output name=deploy-environment;]$(echo ${GITHUB_REF#refs/heads/} | cut -d '/' -f 3 | cut -d '@' -f 2)"
        id: extract-deploy-environment

      # Workaround because github free does not allow to specify
      # different values of the secrets basing on the environment
      - name: Set vault username
        shell: bash
        run: echo "##[set-output name=value;]$([[ ${{ steps.extract-deploy-environment.outputs.deploy-environment }} == prod ]] && echo '${{ secrets.SECRET_SERVER_USERNAME_PROD }}' || [[ ${{ steps.extract-deploy-environment.outputs.deploy-environment }} == pre ]] && echo '${{ secrets.SECRET_SERVER_USERNAME_PRE }}' || echo '${{ secrets.SECRET_SERVER_USERNAME_DEV }}')"
        id: vault-username

      - name: Set vault password
        shell: bash
        run: echo "##[set-output name=value;]$([[ ${{ steps.extract-deploy-environment.outputs.deploy-environment }} == prod ]] && echo '${{ secrets.SECRET_SERVER_PWD_PROD }}' || [[ ${{ steps.extract-deploy-environment.outputs.deploy-environment }} == pre ]] && echo '${{ secrets.SECRET_SERVER_PWD_PRE }}' || echo '${{ secrets.SECRET_SERVER_PWD_DEV }}')"
        id: vault-password

      # Notify the start of the flow
      - name: Discord notification on start
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: |
            [
              {
                "title": "DEPLOYMENT STARTED :clock130:",
                "description": "[** ${{ steps.extract-deploy-environment.outputs.deploy-environment }} **] The project ** ${{ github.repository }} ** is being deployed ( triggered by _ ${{ github.actor }} _). [Action Link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                "color": 16705372
              }
            ]
        uses: Ilshidur/action-discord@master

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      # Hello from AWS: WhoAmI
      - name: Sts GetCallerIdentity
        run: |
          aws sts get-caller-identity

      - name: get tag
        run: echo "VERSION_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        shell: bash

      - name: build and push docker image
        env:
          SECRET_SERVER_USERNAME: ${{ steps.vault-username.outputs.value }}
          SECRET_SERVER_PWD: ${{ steps.vault-password.outputs.value }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PWD: ${{ secrets.NEXUS_PWD }}
          VERSION_TAG: ${{ env.VERSION_TAG }}
        shell: bash
        run: make docker

      - name: Discord notification on success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: |
            [
              {
                "title": "DEPLOYMENT SUCCEEDED! :white_check_mark:",
                "description": "[** ${{ steps.extract-deploy-environment.outputs.deploy-environment }} **] The project ** ${{ github.repository }} ** was successfully deployed :grinning: ( triggered by _ ${{ github.actor }} _). [Action Link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                "color": 5763719
              }
            ]
        uses: Ilshidur/action-discord@master

      - name: Discord notification on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: |
            [
              {
                "title": "DEPLOYMENT FAILED :slight_frown:",
                "description": "[** ${{ steps.extract-deploy-environment.outputs.deploy-environment }} **] The project ** ${{ github.repository }} ** failed to be deployed ( triggered by _ ${{ github.actor }} _). [Action Link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                "color": 15548997
              }
            ]
        uses: Ilshidur/action-discord@master